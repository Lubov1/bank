apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 9200
      targetPort: http
      protocol: TCP
      name: http
      nodePort: 32004
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}