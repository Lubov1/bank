services:
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    depends_on:
      - elasticsearch
      - kafka
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"


  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - accounts
      - front
      - notifications
      - exchange
      - exchange-generator
      - cash
      - blocker
      - transfer

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards



  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_CLUSTER_ID: "abcdefghijklmnopqrstuv"

    volumes:
      - ./data:/var/lib/kafka/data

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    depends_on:
      - accounts
      - front
      - notifications
      - exchange
      - exchange-generator
      - cash
      - blocker
      - transfer



  accounts:
    image: account-service:0.0.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: DockerfileAccountService
    ports:
      - "8082:8080"
    depends_on:
      service-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://service-db:5432/postgres
#
  blocker:
    image: blocker:0.0.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: DockerfileBlocker
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080


  cash:
    image: cash-service:0.0.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: DockerfileCashService
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8098:8080"
    environment:
      - SERVER_PORT=8080

#

  exchange:
    image: exchange:0.0.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: DockerfileExchange
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8095:8080"
    environment:
      - SERVER_PORT=8080



  exchange-generator:
    image: exchange-generator:0.0.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: DockerfileExchangeGenerator
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8096:8080"
    environment:
      - SERVER_PORT=8080


  front:
    image: front:0.0.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: DockerfileFront
    depends_on:
      keycloak:
        condition: service_healthy
      accounts:
        condition: service_started
    ports:
      - "8083:8080"
    environment:
      - SERVER_PORT=8080


  gateway:
    image: gateway:0.0.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: DockerfileGatewayApi
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8084:8080"
    environment:
      - SERVER_PORT=8080

#
  notifications:
    image: notification-service:0.0.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: DockerfileNotificationService
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      - SERVER_PORT=8080
#
  transfer:
    image: transfer:0.0.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: DockerfileTransfer
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8097:8080"
    environment:
      - SERVER_PORT=8080


  service-db:
    image: postgres:14.7
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5


